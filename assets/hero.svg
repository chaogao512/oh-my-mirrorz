    <circle cx="34" cy="34" r="7" fill="#ff6b6b"/><circle cx="58" cy="34" r="7" fill="#ffd166"/><circle cx="82" cy="34" r="7" fill="#49d17d"/>
    <text x="116" y="42" fill="#7890bd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">omm switch --dry-run</text>
    <text x="34" y="104" fill="#57ddff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">PLAN</text>
    <text x="124" y="104" fill="#e6edff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">5 ecosystems · 0 files changed</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <text x="34" y="166" fill="#a8bbdf">pip / uv</text><text x="198" y="166" fill="#58dfa8">READY</text><text x="334" y="166" fill="#dce7ff">MirrorZ</text>
      <text x="34" y="220" fill="#a8bbdf">npm</text><text x="198" y="220" fill="#58dfa8">READY</text><text x="334" y="220" fill="#dce7ff">npmmirror</text>
      <text x="34" y="274" fill="#a8bbdf">Cargo</text><text x="198" y="274" fill="#58dfa8">READY</text><text x="334" y="274" fill="#dce7ff">sparse index</text>
      <text x="34" y="328" fill="#a8bbdf">Homebrew</text><text x="198" y="328" fill="#58dfa8">READY</text><text x="334" y="328" fill="#dce7ff">API + bottles</text>
      <text x="34" y="382" fill="#a8bbdf">APT</text><text x="198" y="382" fill="#ffd166">OPT-IN</text><text x="334" y="382" fill="#dce7ff">--system</text>
