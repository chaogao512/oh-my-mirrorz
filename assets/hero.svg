    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35dbff"/><stop offset="1" stop-color="#9f7cff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="680" rx="36" fill="url(#bg)"/>
  <circle cx="1370" cy="95" r="210" fill="#794fe2" opacity=".2" filter="url(#blur)"/>
  <circle cx="160" cy="580" r="230" fill="#10cbea" opacity=".13" filter="url(#blur)"/>
  <g opacity=".17" stroke="#7adfff"><path d="M0 136h1600M0 272h1600M0 408h1600M0 544h1600"/><path d="M200 0v680M400 0v680M600 0v680M800 0v680M1000 0v680M1200 0v680M1400 0v680"/></g>
  <g transform="translate(92 82)">
