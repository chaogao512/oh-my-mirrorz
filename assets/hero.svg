    <path d="M34 424h675" stroke="#29446f"/>
    <text x="34" y="468" fill="#9eb2d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">snapshot → apply → verify → rollback on failure</text>
