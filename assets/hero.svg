<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">oh-my-mirrorz</title>
  <desc id="desc">A dark gradient hero showing a safe mirror switch plan across five package ecosystems.</desc>
  <defs>
